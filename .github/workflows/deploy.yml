name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: |
          echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set lowercase repository name
        run: |
          echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            IMAGE=ghcr.io/${{ env.REPO_LC }}:latest
            docker pull "$IMAGE"

            mkdir -p /etc/coachwise/uploads
            chown -R 10001:10001 /var/lib/coachwise/uploads 2>/dev/null || true

            # Run migrations
            docker run --rm \
              --network host \
              -v /etc/coachwise/config.yml:/app/config.yml:ro \
              "$IMAGE" \
              /app/bin/migrate up

            # API server
            docker stop coachwise-api || true
            docker rm coachwise-api || true
            docker run -d \
              --name coachwise-api \
              --restart always \
              --network host \
              -v /etc/coachwise/config.yml:/app/config.yml:ro \
              -v /var/lib/coachwise/uploads:/app/uploads \
              "$IMAGE"

            # Worker
            docker stop coachwise-worker || true
            docker rm coachwise-worker || true
            docker run -d \
              --name coachwise-worker \
              --restart always \
              --network host \
              -v /etc/coachwise/config.yml:/app/config.yml:ro \
              "$IMAGE" \
              /app/bin/worker

            docker logout ghcr.io
            docker image prune -f