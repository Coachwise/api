name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            IMAGE=ghcr.io/${{ github.repository }}:latest
            docker pull "$IMAGE"

            # uploads persist on the host; the image runs as uid 10001 (non-root),
            # so make sure it can write there.
            mkdir -p /var/lib/coachwise/uploads
            chown -R 10001:10001 /var/lib/coachwise/uploads 2>/dev/null || true

            # --- run migrations (one-shot, exits) ---
            # --network host → reaches Postgres/NATS running independently on the
            # host; config.yml (mounted) points them at localhost.
            docker run --rm \
              --network host \
              -v /etc/coachwise/config.yml:/app/config.yml:ro \
              "$IMAGE" \
              /app/bin/migrate up

            # --- API server (default CMD = /app/bin/app) ---
            docker stop coachwise-api || true
            docker rm   coachwise-api || true
            docker run -d \
              --name coachwise-api \
              --restart always \
              --network host \
              -v /etc/coachwise/config.yml:/app/config.yml:ro \
              -v /var/lib/coachwise/uploads:/app/uploads \
              "$IMAGE"

            # --- NATS worker (SMS / notifications consumer) ---
            docker stop coachwise-worker || true
            docker rm   coachwise-worker || true
            docker run -d \
              --name coachwise-worker \
              --restart always \
              --network host \
              -v /etc/coachwise/config.yml:/app/config.yml:ro \
              "$IMAGE" \
              /app/bin/worker

            docker logout ghcr.io
            docker image prune -f
