name: Build and Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Nothing is built and nothing is deployed unless the whole E2E suite passes
  # against a real Postgres.
  #
  # This job MUST stay on a GitHub-hosted runner. The suite drops and recreates
  # its database on every run, so it needs a throwaway Postgres — the service
  # container below, inside GitHub's VM. On a self-hosted runner it would find
  # the server's own Postgres on localhost:5432 and drop a database there.
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coachwise
          POSTGRES_PASSWORD: passwd
          POSTGRES_DB: coachwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coachwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Not go-version-file: go.mod's `go` directive is the language version
      # (1.25.0), and setup-go would install exactly that — an unpatched
      # toolchain whose standard library carries every open Go CVE. Take the
      # newest 1.25 patch instead.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true

      - name: Build
        run: go build ./... && go vet ./...

      # Advisory only — it reports what we actually reach, but a CVE never blocks
      # a release. Read it, then decide. When it fires, check the "Fixed in"
      # line: a go1.x.y means bump the toolchain, not a dependency.
      - name: Vulnerability check (advisory)
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # The gate. Nothing is built or deployed unless this passes.
      - name: E2E suite
        run: go test ./tests -args -c test.config.yml

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: |
          echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Same rule as the app: a v1.2.0 tag builds 1.2.0; anything else is a
      # pre-release build stamped with its commit. /health reports this.
      - name: Compute version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0+${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version $VERSION"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set lowercase repository name
        run: |
          echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pin to the exact version built by this run, so a re-deploy can
            # never pick up a different :latest.
            IMAGE=ghcr.io/${{ env.REPO_LC }}:${{ needs.build.outputs.version }}
            docker pull "$IMAGE"

            mkdir -p /var/lib/coachwise/uploads
            chown -R 10001:10001 /var/lib/coachwise/uploads 2>/dev/null || true

            # Run migrations
            docker run --rm \
              --network host \
              -v /etc/coachwise/config.yml:/app/config.yml:ro \
              "$IMAGE" \
              /app/bin/migrate up

            # API server
            docker stop coachwise-api || true
            docker rm coachwise-api || true
            docker run -d \
              --name coachwise-api \
              --restart always \
              --network host \
              -v /etc/coachwise/config.yml:/app/config.yml:ro \
              -v /var/lib/coachwise/uploads:/app/uploads \
              "$IMAGE"

            # Worker
            docker stop coachwise-worker || true
            docker rm coachwise-worker || true
            docker run -d \
              --name coachwise-worker \
              --restart always \
              --network host \
              -v /etc/coachwise/config.yml:/app/config.yml:ro \
              "$IMAGE" \
              /app/bin/worker

            docker logout ghcr.io
            docker image prune -f

            # The deploy is only green if the running API reports the version we
            # just shipped.
            EXPECTED="${{ needs.build.outputs.version }}"
            for i in $(seq 1 15); do
              RUNNING=$(curl -sf http://localhost:8000/health | grep -o '"version":"[^"]*"' | cut -d'"' -f4 || true)
              [ "$RUNNING" = "$EXPECTED" ] && echo "API is running $RUNNING" && exit 0
              sleep 2
            done
            echo "API did not come up on $EXPECTED (last seen: '${RUNNING:-none}')"
            docker logs --tail 50 coachwise-api
            exit 1